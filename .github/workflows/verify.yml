name: Kotlin Verification

on:
  repository_dispatch:
    types: [test-populator-build-success]
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'gradle'

      - name: Set up Test-Populator (from master)
        run: |
          git clone https://github.com/anhem/test-populator.git
          cd test-populator
          mvn clean install -DskipTests
          cd ..
          rm -rf test-populator

      - name: Run tests with Gradle
        run: chmod +x gradlew && ./gradlew test
